<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring with Shadow -->
  <circle cx="100" cy="100" r="92" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="4" filter="url(#dropGlow)" />
  <circle cx="100" cy="100" r="84" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Inner Blue Circular Field -->
  <circle cx="100" cy="100" r="76" fill="url(#blueGrad)" />

  <!-- Center Shield -->
  <path d="M70,62 L130,62 C130,105 100,126 100,128 C100,126 70,105 70,62 Z" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Shield internal division (Red and White) -->
  <path d="M72,64 L99,64 L99,122 C80,108 72,92 72,64 Z" fill="#DC2626" />
  <path d="M101,64 L128,64 C128,92 120,108 101,122 Z" fill="#F8FAFC" />

  <!-- Five Pointed Star at Top of Shield -->
  <polygon points="100,42 103,51 112,51 105,57 107,66 100,61 93,66 95,57 88,51 97,51" fill="url(#goldGrad)" stroke="#B45309" stroke-width="0.8" />

  <!-- Center Tugu / Icon in Shield -->
  <polygon points="100,72 104,82 103,110 97,110 96,82" fill="url(#goldGrad)" />
  <circle cx="100" cy="72" r="3.5" fill="#FDE047" stroke="#B45309" stroke-width="0.8"/>
  <rect x="94" y="108" width="12" height="4" rx="1" fill="#D97706" />

  <!-- Padi (Left Laurel) -->
  <path d="M52,108 C50,86 64,68 76,58" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="56" cy="102" r="3" fill="url(#goldGrad)"/>
  <circle cx="53" cy="91" r="3" fill="url(#goldGrad)"/>
  <circle cx="56" cy="80" r="3" fill="url(#goldGrad)"/>
  <circle cx="63" cy="70" r="3" fill="url(#goldGrad)"/>
  <circle cx="72" cy="62" r="3" fill="url(#goldGrad)"/>

  <!-- Kapas (Right Laurel) -->
  <path d="M148,108 C150,86 136,68 124,58" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="144" cy="102" r="3.5" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
  <circle cx="147" cy="91" r="3.5" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
  <circle cx="144" cy="80" r="3.5" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
  <circle cx="137" cy="70" r="3.5" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
  <circle cx="128" cy="62" r="3.5" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>

  <!-- Ribbon at Bottom -->
  <path d="M48,138 L65,134 L100,144 L135,134 L152,138 L142,152 L130,146 L100,154 L70,146 L58,152 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1.2" />
  <text x="100" y="149" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="900" fill="#1E293B" text-anchor="middle" letter-spacing="1.2">CONDONGCATUR</text>

  <!-- Arc Text: KALURAHAN -->
  <path id="textArc" d="M42,98 A58,58 0 0,1 158,98" fill="none" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="800" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      KAPANEWON DEPOK • SLEMAN
    </textPath>
  </text>
</svg>
